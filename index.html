<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <title>Morning Brief</title>
  <link rel="stylesheet" href="dong-ui/theme.css">
  <link rel="stylesheet" href="styles.css?v=6">
  <script src="dong-ui/theme.js"></script>
</head>
<body>
  <header>
    <h1>Morning Brief</h1>
    <span id="sync-label"></span>
    <a class="dong-home-link" href="https://dong-xuyong.github.io/" aria-label="Back to all apps" title="All apps"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
    <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
  </header>
  <main>
    <p id="weather" class="weather-line"></p>
    <a class="journal-link" href="https://dong-xuyong.github.io/journal/">Open journal</a>
    <section id="sunlight" class="card"></section>
    <section id="brief" class="card">
      <button type="button" id="play" aria-pressed="false">Play</button>
      <span id="mins" class="mins"></span>
      <p id="brief-text"></p>
    </section>
  </main>
  <footer id="connect" hidden>
    <button type="button" id="connect-btn" class="ghost">Connect GitHub</button>
  </footer>
  <script src="dong-ui/gh-sync.js"></script>
  <script src="core.js?v=5"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
