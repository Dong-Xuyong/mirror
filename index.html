<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>Morning Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dong-ui/theme.css">
  <link rel="stylesheet" href="/ui/shell.css?v=1">
  <link rel="stylesheet" href="styles.css?v=7">
  <script src="dong-ui/theme.js"></script>
</head>
<body class="dx">
  <header class="dx-header">
    <a class="dx-home" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </a>
    <h1 class="dx-title">Morning Brief</h1>
    <div class="dx-actions">
      <span id="sync-label"></span>
      <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
    </div>
  </header>
  <main class="dx-main">
    <p id="weather" class="weather-line dx-card"></p>
    <a class="journal-link dx-btn dx-btn--ghost" href="https://dong-xuyong.github.io/journal/">Open journal</a>
    <section id="sunlight" class="dx-card"></section>
    <section id="brief" class="dx-card">
      <button type="button" id="play" class="dx-btn" aria-pressed="false">Play</button>
      <span id="mins" class="mins"></span>
      <p id="brief-text"></p>
    </section>
  </main>
  <footer id="connect" hidden>
    <button type="button" id="connect-btn" class="dx-btn">Connect GitHub</button>
  </footer>
  <script src="dong-ui/gh-sync.js"></script>
  <script src="core.js?v=5"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
